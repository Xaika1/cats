{% from "_macros.html" import cat_icon %}
<nav class="navbar navbar-expand app-navbar sticky-top py-2">
    <div class="container-xl px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-800 me-4" href="#/">
            <span class="cat-logo">{{ cat_icon() }}</span>
            <span class="d-flex flex-column lh-1">
                <span>{{ appName }}</span>
                <small class="text-body-secondary fw-semibold" style="font-size:.7rem;">учёт котиков и здоровья</small>
            </span>
        </a>

        <ul class="navbar-nav gap-1 me-auto">
            <li class="nav-item">
                <a class="nav-link {% if route == '/' or route == '/cats' %}active{% endif %}" href="#/cats">
                    <i class="bi bi-grid me-1"></i>Котики
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if route == '/profile' %}active{% endif %}" href="#/profile">
                    <i class="bi bi-person-badge me-1"></i>Профиль
                </a>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-icon border-0" id="themeToggle"
                    aria-label="Переключить тему" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Светлая / тёмная тема">
                <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>

            <div class="dropdown">
                <button class="btn p-0 border-0 d-flex align-items-center gap-2" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Меню профиля">
                    <span class="avatar-circle">{{ user.initial }}</span>
                    <span class="d-none d-lg-inline fw-semibold small">{{ user.display_name }}</span>
                    <i class="bi bi-chevron-down small text-body-secondary"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow p-2 mt-2" style="width:240px;">
                    <li class="px-3 py-2">
                        <div class="fw-bold text-truncate">{{ user.display_name }}</div>
                        <div class="text-body-secondary small text-truncate">{{ user.email or "email не указан" }}</div>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item rounded-3" href="#/profile"><i class="bi bi-person me-2"></i>Профиль</a>
                    </li>
                    <li>
                        <a class="dropdown-item rounded-3 text-danger" href="#/login" data-logout>
                            <i class="bi bi-box-arrow-right me-2"></i>Выйти
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
